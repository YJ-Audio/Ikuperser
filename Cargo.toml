[workspace]
members = ["xtask"]

[package]
name = "ikuperser"
version = "0.1.0"
edition = "2024"
description = "A phase dispersion effect built from a chain of allpass filters"
license = "MIT"

[lib]
# `lib` is required for the standalone binary target.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "ikuperser"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = [
  "assert_process_allocs",
  "standalone",
] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
